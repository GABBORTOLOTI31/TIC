# =============================================
# CONFIGURAÇÕES DO SERVIDOR
# =============================================
server.port=8080

# =============================================
# CONFIGURAÇÕES DO BANCO DE DADOS (PostgreSQL)
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ordemservico_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# CONFIGURAÇÕES DO JWT
# =============================================
# Chave secreta para assinatura dos tokens JWT (minimo 256 bits para HS256)
jwt.secret=3c6e45f2b8a1d7e9f4c2b3a5e8d1f7c9b2a4e6d8f1c3b5a7e9d2f4c6b8a1e3d
jwt.expiracao=86400000

