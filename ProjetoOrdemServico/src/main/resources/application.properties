# =============================================
# CONFIGURAÇÕES DO SERVIDOR
# =============================================
server.port=8080

# =============================================
# CONFIGURAÇÕES DO BANCO DE DADOS (MySQL)
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/ordemservico_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# CONFIGURAÇÕES DO JWT
# =============================================
# Chave secreta para assinatura dos tokens JWT (minimo 256 bits para HS256)
jwt.secret=3c6e45f2b8a1d7e9f4c2b3a5e8d1f7c9b2a4e6d8f1c3b5a7e9d2f4c6b8a1e3d
jwt.expiracao=86400000
